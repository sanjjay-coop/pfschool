<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>

	<div class="container-fluid">

		<h4 class="h4 p-2">Teaching Staff</h4>

		<div class="alert alert-warning p-2" role="alert" th:text="${message}"
			th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-4 my-2" th:each="ob : ${listTeacher}">
				<div class="card h-100">
					<h5 class="card-header text-center bg-primary-subtle bg-gradient"
						th:text="${ob.name}"></h5>
					<div class="card-body text-center">
						<img th:if="${ob.fileData != null}"
							class="rounded mx-auto d-block text-center pb-3 img-fluid"
							style="max-height: 300px;"
							th:src="@{/home/staff/photo/download/{orderId}(orderId=${ob.id})}" />
							
						<i th:if="${ob.fileData == null}"
							class="bi bi-person-bounding-box text-light"
							style="font-size: 10rem; "></i>
						<div class="small mb-3" th:text="${ob.remarks}"></div>
						<i class="bi bi-phone"></i><th:block class="small bold"
							th:text="${ob.mobile}"></th:block><br/>
						<i class="bi bi-envelope"></i> <th:block class="small bold"
							th:text="${ob.email}"></th:block>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="container" th:replace="~{fragments :: footer}"></div>

</body>

</html>

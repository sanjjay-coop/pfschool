<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>

	<div class="container-fluid">

		<h4 class="h4 p-2">Leader (View)</h4>

		<div class="alert alert-warning p-2" role="alert" th:text="${message}"
			th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-primary btn-sm" role="button"
						th:href="@{/admin/leader/list/current}"><i
						class="bi bi-chevron-double-left"></i> To List</a>
				</div>
			</div>
		</div>

		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{leader.file}"></label>
			<div class="col-sm-10">
				<img class="border border-1 rounded-2" width="200"
					th:src="@{/home/leader/photo/download/{orderId}(orderId=${leader.id})}" />
			</div>
		</div>
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{leader.name}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light" th:text="${leader.name}"></span>
			</div>
		</div>
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{leader.about}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light" th:utext="${leader.about}"></span>
			</div>
		</div>
	</div>

	<div class="container" th:replace="~{fragments :: footer}"></div>

</body>
</html>

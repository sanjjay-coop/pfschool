<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>

	<div class="container-fluid">

		<h4 class="h4 p-2">Event (View)</h4>

		<div class="alert alert-warning p-2" role="alert" th:text="${message}"
			th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-12">
				<div class="d-grid gap-2 d-md-block">
					<a class="btn btn-primary btn-sm" role="button"
						th:href="@{/admin/event/list/current}"><i
						class="bi bi-chevron-double-left"></i> To List</a>
				</div>
			</div>
		</div>

		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{event.title}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light" th:text="${event.title}"></span>
			</div>
		</div>
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{event.description}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light"
					th:utext="${event.description}"></span>
			</div>
		</div>
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{event.fromDateTime}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light"
					th:text="${#temporals.format(event.fromDateTime, 'dd-MM-yyyy HH:mm')}"></span>
			</div>
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{event.toDateTime}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light"
					th:text="${#temporals.format(event.toDateTime, 'dd-MM-yyyy HH:mm')}"></span>
			</div>
		</div>
		<div class="row p-2">
			<label class="col-sm-2 col-form-label text-primary"
				th:text="#{event.contactDetails}"></label>
			<div class="col-sm-10">
				<span class="form-control border-light"
					th:text="${event.contactDetails}"></span>
			</div>
		</div>
	</div>

	<div class="container" th:replace="~{fragments :: footer}"></div>

</body>
</html>

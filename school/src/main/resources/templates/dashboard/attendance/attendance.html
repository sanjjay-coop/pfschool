<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

	<div class="container text-center" th:replace="~{fragments :: header}"></div>

	<div class="container-fluid">

		<h4 class="h4 p-2" th:text="'Attendance Register'"></h4>

		<div class="alert alert-warning p-2" role="alert" th:text="${message}"
			th:if="${message != null }"></div>

		<div class="row p-2">
			<div class="col-2"></div>
			<div class="col-8">
				<div class="row p-2">
					<div class="col-4 text-start">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-tertiary btn-sm" role="button"
								th:href="@{/dashboard/attendance/{orderId1}/{orderId2}(orderId1=${previousMonth}, orderId2=${previousYear})}"><i
								class="bi bi-chevron-double-left"></i> Previous Month</a>
						</div>
					</div>
					<div class="col-4 text-center"
						th:text="${#dates.monthName(date)} + ', ' + ${#dates.year(date)}">

					</div>
					<div class="col-4 text-end">
						<div class="d-grid gap-2 d-md-block">
							<a class="btn btn-tertiary btn-sm" role="button"
								th:href="@{/dashboard/attendance/{orderId1}/{orderId2}(orderId1=${nextMonth}, orderId2=${nextYear})}">Next
								Month <i class="bi bi-chevron-double-right"></i>
							</a>
						</div>
					</div>
				</div>
				<table class="table table-sm small table-bordered table-striped">
					<thead>
						<tr>
							<th class="col-sm-1 text-center" th:text="Sun"></th>
							<th class="col-sm-1 text-center" th:text="Mom"></th>
							<th class="col-sm-1 text-center" th:text="Tue"></th>
							<th class="col-sm-1 text-center" th:text="Wed"></th>
							<th class="col-sm-1 text-center" th:text="Thu"></th>
							<th class="col-sm-1 text-center" th:text="Fri"></th>
							<th class="col-sm-1 text-center" th:text="Sat"></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="row,rowIterator : ${data}">
							<td class="text-center" th:each="col,colIterator : ${row}">
								<span class="text-center"
								th:utext="${data[__${rowIterator.index}__][__${colIterator.index}__]}"
								th:classappend="${#strings.contains(data[__${rowIterator.index}__][__${colIterator.index}__], 'Present')} ? 'text-success' : 
											(${#strings.contains(data[__${rowIterator.index}__][__${colIterator.index}__], 'Absent')} ? 'text-danger' : 
											(${#strings.contains(data[__${rowIterator.index}__][__${colIterator.index}__], 'Late')} ? 'text-warning' :
											(${#strings.contains(data[__${rowIterator.index}__][__${colIterator.index}__], 'Leave')} ? 'text-success')))"
								th:if="${not #strings.isEmpty(data[__${rowIterator.index}__][__${colIterator.index}__])}"></span>
								<span class="text-center"
								th:utext="${data[__${rowIterator.index}__][__${colIterator.index}__]}"
								th:if="${#strings.isEmpty(data[__${rowIterator.index}__][__${colIterator.index}__])}"></span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div class="container" th:replace="~{fragments :: footer}"></div>

</body>

</html>
